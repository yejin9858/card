<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>카드 아카이브</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- 로그인 / 회원가입 화면 -->
<div id="auth-screen" class="screen">
  <div class="auth-box">
    <h1>📇 카드 아카이브</h1>
    <p class="sub">모은 카드를 기록해보세요</p>

    <div class="tabs">
      <button id="tab-login" class="tab active" type="button">로그인</button>
      <button id="tab-signup" class="tab" type="button">회원가입</button>
    </div>

    <form id="login-form" class="auth-form">
      <input type="email" id="login-email" placeholder="이메일" required />
      <input type="password" id="login-password" placeholder="비밀번호" required />
      <button type="submit">로그인</button>
      <p class="error" id="login-error"></p>
    </form>

    <form id="signup-form" class="auth-form" hidden>
      <input type="text" id="signup-nickname" placeholder="닉네임" required />
      <input type="email" id="signup-email" placeholder="이메일" required />
      <input type="password" id="signup-password" placeholder="비밀번호 (6자 이상)" required minlength="6" />
      <button type="submit">회원가입</button>
      <p class="error" id="signup-error"></p>
    </form>

  </div>
</div>

<!-- 메인 앱 화면 -->
<div id="app-screen" class="screen" hidden>
  <header>
    <h1>📇 카드 아카이브</h1>
    <div class="user-info">
      <span id="user-nickname"></span>
      <button id="logout-btn" type="button">로그아웃</button>
    </div>
  </header>

  <main>
    <section id="content-panel">
      <div id="empty-state">
        <p>오른쪽에서 카드 시리즈를 선택해주세요 →</p>
      </div>

      <div id="series-content" hidden>
        <div class="progress-wrap">
          <div class="progress-info">
            <h2 id="series-title"></h2>
            <span id="progress-text"></span>
          </div>
          <div class="progress-bar"><div id="progress-fill"></div></div>
          <div id="top-collector" class="top-collector"></div>
        </div>

        <div class="filter-bar">
          <select id="status-filter" class="filter-select">
            <option value="all">전체</option>
            <option value="collected">수집함</option>
            <option value="missing">미수집</option>
          </select>
          <select id="team-filter" class="filter-select">
            <option value="all">전체 팀</option>
          </select>
          <select id="category-filter" class="filter-select">
            <option value="all">전체 카테고리</option>
          </select>
        </div>

        <div id="card-grid" class="card-grid"></div>
      </div>
    </section>

    <aside id="series-menu">
      <h2>카드 시리즈</h2>
      <ul id="series-list"></ul>
    </aside>
  </main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
